name: Build ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["iso/**", "setup.sh", ".github/workflows/iso.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -s sh setup.sh iso/build.sh iso/genapkovl-testard.sh iso/testard-install iso/mkimg.testard.sh

      - name: Build
        run: |
          VERSION=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' setup.sh)
          case "$GITHUB_REF" in refs/tags/v*) ;; *) VERSION="$VERSION-dev.$GITHUB_RUN_NUMBER" ;; esac
          docker run --rm -v "$PWD":/src -w /src -e VERSION="$VERSION" alpine:3.22 sh iso/build.sh

      - name: Install test (QEMU)
        timeout-minutes: 30
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils python3-pexpect
          python3 iso/test/install-test.py out/testard-os-*.iso

      - uses: actions/upload-artifact@v5
        with:
          name: testard-os-iso
          path: out/testard-os-*
          retention-days: 14
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/testard-os-*.iso out/testard-os-*.iso.sha256 \
            --title "Testard OS ${GITHUB_REF_NAME#v}" --notes-file iso/RELEASE_NOTES.md
