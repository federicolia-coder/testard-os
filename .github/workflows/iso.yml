name: Build ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["iso/**", "setup.sh", ".github/workflows/iso.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the version in setup.sh"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Lint
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -s sh setup.sh iso/build.sh iso/genapkovl-testard.sh iso/testard-install iso/mkimg.testard.sh

      - name: Build
        run: |
          VERSION=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' setup.sh)
          if [ "${{ inputs.release }}" != "true" ] && ! case "$GITHUB_REF" in refs/tags/v*) true ;; *) false ;; esac; then
            VERSION="$VERSION-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker run --rm -v "$PWD":/src -w /src -e VERSION="$VERSION" alpine:3.22 sh iso/build.sh

      - name: Install test (QEMU)
        timeout-minutes: 30
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf python3-pexpect
          python3 iso/test/install-test.py out/testard-os-*.iso

      - name: Install test, UEFI, graphical installer (QEMU)
        timeout-minutes: 30
        run: SCREENSHOT_DIR="$RUNNER_TEMP/screens" python3 iso/test/install-test.py out/testard-os-*.iso --uefi --gui

      - name: Publish the test build
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/testard-os-*.iso >/dev/null 2>&1 || exit 0
          gh release view ci-latest >/dev/null 2>&1 || \
            gh release create ci-latest --prerelease --title "Latest test build" \
              --notes "The ISO and screenshots from the latest CI run on main. Not a release: use the latest numbered version."
          mkdir -p "$RUNNER_TEMP/latest"
          cp out/testard-os-*-x86_64.iso "$RUNNER_TEMP/latest/testard-os-latest-x86_64.iso"
          gh release upload ci-latest "$RUNNER_TEMP/latest/testard-os-latest-x86_64.iso" $(ls "$RUNNER_TEMP"/screens/*.png 2>/dev/null) --clobber

      - uses: actions/upload-artifact@v5
        with:
          name: testard-os-iso
          path: out/testard-os-*
          retention-days: 14
          compression-level: 0

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" out/testard-os-*.iso out/testard-os-*.iso.sha256 \
            --target "$GITHUB_SHA" --title "Testard OS $VERSION" --notes-file iso/RELEASE_NOTES.md
